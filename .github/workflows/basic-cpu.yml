name: Basic CPU source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: basic-cpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation-basic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the exact CPU profile
        run: python -m pip install -r requirements-cpu.lock
      - name: Foundation basics and runtime memory unit checks; no model assets or fitting
        run: >-
          python -B -m pytest -q -p no:cacheprovider
          tests/test_foundation0_cpu.py::test_01_manifest_and_schema_validation
          tests/test_foundation0_cpu.py::test_02_registry_graph_and_semantics_blind_routing
          tests/test_runtime_sessions.py
          tests/test_runtime_bridge.py
          tests/test_memory_addressing.py
          tests/test_memory_affine_bridge.py
          tests/test_memory_bridge.py
          tests/test_memory_context.py
          tests/test_memory_lexical_bridge.py
          tests/test_memory_lexical_runtime.py
          tests/test_memory_matrix.py
          tests/test_memory_payload_bridge.py
          tests/test_memory_payload_matrix.py
          tests/test_memory_payload_runtime.py
          tests/test_memory_query_normalization.py
          tests/test_memory_query_normalization_runtime.py
          tests/test_memory_runtime.py
          tests/test_memory_turn_stop.py
          tests/test_runtime_memory_cli.py
          tests/test_runtime_memory_integration.py
          tests/test_runtime_memory_store.py
          tests/test_memory_crash_safety.py
          tests/test_fact_intent.py
          tests/test_dialogue_acquisition.py
          tests/test_confirmation_binding.py
      - name: Install the runtime wheel and check its public entry point
        run: |
          python -m pip install --no-index --no-deps --no-build-isolation .
          temporary_directory="$(mktemp -d)"
          cd "$temporary_directory"
          python -c "import alice_runtime; print(alice_runtime.__file__)"
          alice --help
