name: Basic CPU source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: basic-cpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation-basic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the exact CPU profile
        run: python -m pip install -r requirements-cpu.lock
      - name: Original Foundation schema and routing checks; no training
        run: >-
          python -B -m pytest -q -p no:cacheprovider
          tests/test_foundation0_cpu.py::test_01_manifest_and_schema_validation
          tests/test_foundation0_cpu.py::test_02_registry_graph_and_semantics_blind_routing
